name: 'Yandex Serverless Action'
description: 'Deploy new version of Serverless function to Yandex Cloud'
author: 'Goodsmileduck'
branding:
  color: 'blue'
  icon: 'upload-cloud'
inputs:
  description:
    description: 'Function description'
    default: ''
    required: false
  oidc_service_account_id:
    description: 'Service account ID to authenticate as via GitHub OIDC (Yandex Cloud Workload Identity Federation). Requires `permissions: id-token: write`.'
    default: ''
    required: false
  oidc_audience:
    description: 'Audience for the GitHub OIDC token. Must match the federation audience. Defaults to GitHub default (https://github.com/<owner>).'
    default: ''
    required: false
  service_account_key:
    description: 'Service account authorized key JSON (output of `yc iam key create`)'
    default: ''
    required: false
  iam_token:
    description: 'Yandex Cloud IAM token'
    default: ''
    required: false
  token:
    description: 'DEPRECATED: Yandex OAuth token. Yandex Cloud rejects OAuth tokens issued after 2026-06-01; use oidc_service_account_id or service_account_key.'
    default: ''
    required: false
  accessKeyId:
    description: 'Static access key ID for the bucket upload. Optional: without it the package is uploaded with the IAM token (needs storage.uploader)'
    default: ''
    required: false
  secretAccessKey:
    description: 'Static secret access key for the bucket upload (see accessKeyId)'
    default: ''
    required: false
  function_id:
    description: 'Function Id in Yandex Cloud'
    default: ''
    required: true
  bucket:
    description: 'S3 bucket name for code'
    default: ''
    required: false
  runtime:
    description: 'Runtime for function'
    default: ''
    required: true
  entrypoint:
    description: 'Entrypoint for function'
    default: ''
    required: true
  source:
    description: 'Source directory to zip, or path to a prebuilt .zip file to deploy as-is'
    default: '.'
    required: false
  include:
    description: 'Glob patterns (comma separated) of files to include from the source directory. Default: everything'
    default: ''
    required: false
  exclude:
    description: 'Glob patterns (comma separated) of files to exclude from the source directory'
    default: ''
    required: false
  memory:
    description: 'Memory in MB (128-8192)'
    default: '128'
    required: false
  environment:
    description: 'Env variables for function'
    default: ''
    required: false
  execution_timeout:
    description: 'Execution timeout in seconds (1-3600)'
    default: '5'
    required: false
  service_account:
    description: 'Service account for function'
    default: ''
    required: false
  tags:
    description: 'Version tags (comma separated), e.g. `stable,v42`. `$latest` is always set by Yandex Cloud'
    default: ''
    required: false
  secrets:
    description: 'Lockbox secrets as environment variables, one per line or `;` separated: `ENV_VAR=<secret_id>/<version_id>/<key>`'
    default: ''
    required: false
  log_group_id:
    description: 'Cloud Logging group ID for function logs. Default: the folder default log group'
    default: ''
    required: false
  log_min_level:
    description: 'Minimum log level: TRACE, DEBUG, INFO, WARN, ERROR or FATAL'
    default: ''
    required: false
  log_disabled:
    description: 'Set to `true` to disable function logging'
    default: ''
    required: false
  network_id:
    description: 'VPC network ID to run the function in'
    default: ''
    required: false
  concurrency:
    description: 'Max concurrent requests per function instance (1-16)'
    default: ''
    required: false
  tmpfs_size:
    description: 'Size of /tmp in MB'
    default: ''
    required: false
  mounts:
    description: 'Mounts, one per line or `;` separated. Bucket: `name=<mount>,bucket=<bucket>[,prefix=<prefix>][,mode=ro|rw]`. Ephemeral disk: `name=<mount>,disk_size=<GB>`'
    default: ''
    required: false
  metadata_options:
    description: 'Metadata service access: `gce_http_endpoint=enabled|disabled,aws_v1_http_endpoint=enabled|disabled`'
    default: ''
    required: false

outputs:
  version_id:
    description: 'ID of the created function version'
  time:
    description: 'Time the deployment finished'

runs:
  using: 'node24'
  main: 'dist/index.js'
