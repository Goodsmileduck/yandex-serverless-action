name: 'Yandex Serverless Action'
description: 'Deploy new version of Serverless function to Yandex Cloud'
author: 'Goodsmileduck'
branding:
  color: 'blue'
  icon: 'upload-cloud'
inputs:
  description:
    description: 'Function description'
    default: ''
    required: false
  oidc_service_account_id:
    description: 'Service account ID to authenticate as via GitHub OIDC (Yandex Cloud Workload Identity Federation). Requires `permissions: id-token: write`.'
    default: ''
    required: false
  oidc_audience:
    description: 'Audience for the GitHub OIDC token. Must match the federation audience. Defaults to GitHub default (https://github.com/<owner>).'
    default: ''
    required: false
  service_account_key:
    description: 'Service account authorized key JSON (output of `yc iam key create`)'
    default: ''
    required: false
  iam_token:
    description: 'Yandex Cloud IAM token'
    default: ''
    required: false
  token:
    description: 'DEPRECATED: Yandex OAuth token. Yandex Cloud rejects OAuth tokens issued after 2026-06-01; use oidc_service_account_id or service_account_key.'
    default: ''
    required: false
  accessKeyId:
    description: 'Yandex AWS Access Key Id when s3 bucket used'
    default: ''
    required: false
  secretAccessKey:
    description: 'Yandex AWS Secret Access Key when s3 bucket used'
    default: ''
    required: false
  function_id:
    description: 'Function Id in Yandex Cloud'
    default: ''
    required: true
  bucket:
    description: 'S3 bucket name for code'
    default: ''
    required: false
  runtime:
    description: 'Runtime for function'
    default: ''
    required: true
  entrypoint:
    description: 'Entrypoint for function'
    default: ''
    required: true
  source:
    description: 'Source directory for cloud function in git repo'
    default: '.'
    required: false
  exclude:
    description: 'Exclude patterns (comma separated) for source directory'
    default: ''
    required: false
  memory:
    description: 'Memory in Mb'
    default: '128'
    required: false
  environment:
    description: 'Env variables for function'
    default: ''
    required: false
  execution_timeout:
    description: 'Execution timeout'
    default: '5'
    required: false
  service_account:
    description: 'Service account for function'
    default: ''
    required: false

runs:
  using: 'node24'
  main: 'dist/index.js'
